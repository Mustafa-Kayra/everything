name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Everything.Core.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/Everything.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o artifacts/publish

      - name: Portable + kurulum paketi
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Everything.App/Everything.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          Copy-Item artifacts/publish/EverythingArama.exe artifacts/Everything-Portable.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer/EverythingArama.iss
          Push-Location artifacts
          Get-FileHash Everything-Portable.exe, Everything-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: EverythingArama
          path: |
            artifacts/Everything-Portable.exe
            artifacts/Everything-Setup.exe
            artifacts/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Everything-Portable.exe
            artifacts/Everything-Setup.exe
            artifacts/SHA256SUMS.txt
